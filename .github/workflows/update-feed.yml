# Rebuilds docs/waldo.ics every 6 hours and commits it only when it changed.
# GitHub Pages (Settings > Pages > "Deploy from a branch", main, /docs) then
# serves it at https://<owner>.github.io/<repo>/waldo.ics
#
# If the tests or the script fail (site down, layout change, ...), the job
# fails, nothing is committed, the last good feed stays up, and the issue
# "Calendar feed update failing" is opened (emailing ALERT_MENTION). It
# closes itself after the next successful run.
name: Update calendar feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 h, off the hour (UTC)
  workflow_dispatch:         # Actions tab > "Run workflow"
    inputs:
      accept_structure:
        description: "Accept the page-structure change from the last alert (check the pages first)"
        type: boolean
        default: false
      allow_drops:
        description: "Allow many upcoming events to disappear at once (after a 'vanished at once' alert you've checked)"
        type: boolean
        default: false
      test_alert:
        description: "Fail on purpose to test the alert email (doesn't contact On The Stage)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the feed
  issues: write     # open/close the alert issue

concurrency:
  group: feed
  cancel-in-progress: false

env:
  ALERT_MENTION: kimslawson   # GitHub user @-mentioned (emailed) in alert issues

defaults:
  run:
    shell: bash   # bash -eo pipefail, so "| tee" can't hide a failure

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the script gives up after 10 (--deadline 600)
    steps:
      - uses: actions/checkout@v7

      - name: Simulated failure (test alert)
        if: inputs.test_alert
        run: |
          echo "error: this is a test alert (test_alert was ticked); the feed was not touched" | tee build.log
          exit 1

      - name: Test
        run: python3 -m unittest discover -s tests 2>&1 | tee build.log

      - name: Build feed
        run: >
          python3 ots_ics.py https://www.onthestage.tickets/the-waldo-theatre
          --about --durations durations.json --state state.json
          --structure structure.json ${{ inputs.accept_structure && '--accept-structure' || '' }}
          ${{ inputs.allow_drops && '--allow-drops' || '' }}
          --deadline 600 --out docs/waldo.ics 2>&1 | tee build.log

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub disables scheduled workflows in public repos after 60 days
          # without activity; touch a heartbeat file if we're getting close.
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            date -u +%FT%TZ > docs/last-checked.txt
          fi
          git add docs/ state.json structure.json
          if ! git diff --cached --quiet; then
            git commit -m "Update calendar feed"
            git push
          fi

      - name: Alert (open or update issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/alert.sh fail build.log

      - name: Clear alert (close issue)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/alert.sh ok
